name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # -- Frontend Checks ---------------------------------------------------------
  frontend:
    name: Frontend � Type Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
        run: npx tsc --noEmit

      - name: Lint
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

  # -- Backend Checks ----------------------------------------------------------
  backend:
    name: Backend � Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff mypy

      - name: Ruff � lint
        run: python -m ruff check .
        continue-on-error: true

      - name: Ruff � format check
        run: python -m ruff format --check .
        continue-on-error: true

      - name: Run tests
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/watchparty_test"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          ENCRYPTION_KEY: "Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzX18="
          HLS_KEY_SIGNING_SECRET: "ci-test-hls-signing-secret-not-for-production"
          SUPABASE_JWT_SECRET: "ci-test-supabase-jwt-secret-not-for-production"
        run: python -m pytest tests/ -v --tb=short
        continue-on-error: true
